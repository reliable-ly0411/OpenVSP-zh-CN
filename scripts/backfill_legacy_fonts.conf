<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Preserve system font directories, caches, and normal font configuration. -->
  <!-- FLTK Xft 6336959306e0 calls its Helvetica/Courier slots sans/mono. -->
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>sans</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any" compare="eq"><string>Courier</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Sans Mono CJK SC</string></edit>
  </match>
  <!-- Apply exact application aliases before system rules expand generic families. -->
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
</fontconfig>
