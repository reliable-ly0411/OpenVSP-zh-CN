name: Legacy upstream transplant entry (read-only notice)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - name: Use the reviewed workflows on the default branch
        run: |
          echo 'This legacy-family entry no longer updates main, creates tags, or publishes releases.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Use Prepare and validate OpenVSP upstream candidates on the default branch for new official-version candidates.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Build and promote reviewed candidates with the default-branch five-platform native prerelease workflows.' >> "$GITHUB_STEP_SUMMARY"
