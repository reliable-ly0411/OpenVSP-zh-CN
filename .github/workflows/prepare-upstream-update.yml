name: Prepare OpenVSP Upstream Update

on:
  workflow_call:
    inputs:
      upstream_ref:
        description: Official branch, tag, or commit; empty selects latest official released tag
        required: false
        default: ''
        type: string
    outputs:
      changed:
        value: ${{ jobs.prepare.outputs.changed }}
      sha:
        value: ${{ jobs.prepare.outputs.sha }}
      branch:
        value: ${{ jobs.prepare.outputs.branch }}

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      sha: ${{ steps.candidate.outputs.sha || steps.sync.outputs.sha }}
      branch: ${{ steps.candidate.outputs.branch }}
    steps:
      - name: Checkout current localized main with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Snapshot trusted maintenance tools before merging upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/openvsp-maintenance"
          cp scripts/select_official_release.py scripts/sync_upstream.py scripts/check_localization_release.py scripts/upstream_ui_report.py "$RUNNER_TEMP/openvsp-maintenance/"

      - name: Prepare upstream merge and metadata
        id: sync
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r .repository .github/upstream.json)
          test "$repository" = OpenVSP/OpenVSP
          upstream_ref=$(python3 -I "$RUNNER_TEMP/openvsp-maintenance/select_official_release.py")
          jq -r .base_commit .github/upstream.json > "$RUNNER_TEMP/openvsp-maintenance/upstream-before.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add official "https://github.com/${repository}.git"
          git remote set-url --push official DISABLED
          git fetch --no-tags -- official "$upstream_ref"
          UPSTREAM_SOURCE_REF="$upstream_ref" python3 -I "$RUNNER_TEMP/openvsp-maintenance/sync_upstream.py" FETCH_HEAD

      - name: Check and commit candidate without write credentials
        id: candidate
        if: steps.sync.outputs.changed == 'true'
        env:
          UPSTREAM_SHA: ${{ steps.sync.outputs.upstream_sha }}
          VERSION: ${{ steps.sync.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/openvsp-maintenance/check_localization_release.py" --source "$GITHUB_WORKSPACE"
          git diff --cached --check -- .github/upstream.json README_zh-CN.md AGENTS.md
          python3 -I "$RUNNER_TEMP/openvsp-maintenance/upstream_ui_report.py" "$(cat "$RUNNER_TEMP/openvsp-maintenance/upstream-before.txt")" "$UPSTREAM_SHA" --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/openvsp-maintenance/ui-string-report.json"
          git commit -m "自动同步 OpenVSP ${VERSION} (${UPSTREAM_SHA:0:12})"
          # 每次运行保留独立候选分支，仅输出候选分支，不自动推进主分支或创建 Release。
          branch="automation/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"
          echo "候选分支：\`$branch\`；等待轻量源代码验证与后续手动五平台验收；不自动同步 main。" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep added GUI string review evidence
        if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: upstream-ui-string-report
          path: ${{ runner.temp }}/openvsp-maintenance/ui-string-report.json
          retention-days: 90

      - name: Push only the checked candidate with a step-scoped token
        if: steps.sync.outputs.changed == 'true'
        env:
          PUSH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          CANDIDATE_BRANCH: ${{ steps.candidate.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_BRANCH" =~ ^automation/upstream-[0-9]+-[0-9]+$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          # No token is persisted in .git/config or exposed to merged-tree code.
          export GIT_CONFIG_COUNT=2
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_KEY_1=core.hooksPath
          export GIT_CONFIG_VALUE_1=/dev/null
          git push origin "$CANDIDATE_SHA:refs/heads/$CANDIDATE_BRANCH"

      - name: Report unchanged upstream
        if: steps.sync.outputs.changed == 'false'
        run: echo '所选官方上游已包含在 main 中；不重复创建候选或修改已发布资产。' >> "$GITHUB_STEP_SUMMARY"

      - name: Report preparation failure
        if: failure()
        shell: bash
        run: |
          {
            echo '上游同步准备失败，main 未更新。请查看失败步骤；代码冲突文件如下：'
            git diff --name-only --diff-filter=U
          } >> "$GITHUB_STEP_SUMMARY"
