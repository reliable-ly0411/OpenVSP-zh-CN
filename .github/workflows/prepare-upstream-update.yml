name: Prepare OpenVSP Upstream Update

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official OpenVSP branch, tag, or commit
        required: true
        default: main
        type: string

permissions:
  contents: write
  issues: write

concurrency:
  group: prepare-openvsp-upstream-update
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout localized source with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Transplant localization onto official source
        id: transplant
        env:
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        shell: bash
        run: |
          set -euo pipefail
          localized_head=$(git rev-parse HEAD)
          cp .github/upstream.json "$RUNNER_TEMP/upstream.json"
          repository=$(jq -r .repository "$RUNNER_TEMP/upstream.json")
          base_commit=$(jq -r .base_commit "$RUNNER_TEMP/upstream.json")

          git remote add official "https://github.com/${repository}.git"
          git remote set-url --push official DISABLED
          git fetch --no-tags official "$UPSTREAM_REF"
          upstream_commit=$(git rev-parse FETCH_HEAD)
          if ! git cat-file -e "$base_commit^{commit}" 2>/dev/null; then
            git fetch --no-tags official "$base_commit"
          fi
          if [[ "$base_commit" == "$upstream_commit" ]]; then
            echo "官方源码与记录基线相同，无需准备更新。" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --binary --full-index "$base_commit" "$localized_head" -- . \
            ':(exclude).github/upstream.json' > "$RUNNER_TEMP/localization.patch"
          git checkout --detach "$upstream_commit"
          if ! git apply --3way --index "$RUNNER_TEMP/localization.patch"; then
            echo "## 汉化补丁存在冲突" >> "$GITHUB_STEP_SUMMARY"
            echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
            git diff --name-only --diff-filter=U | tee -a "$GITHUB_STEP_SUMMARY"
            echo '~~~' >> "$GITHUB_STEP_SUMMARY"
            echo "请在本地以同一官方提交人工解决冲突，自动化未修改 main。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          version=$(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("src/cmake/VSP_Version.cmake").read_text(encoding="utf-8")
          parts = [
              re.search(rf"SET\(\s*VSPVER_{key}\s+(\d+)\s*\)", text).group(1)
              for key in ("MAJOR", "MINOR", "PATCH")
          ]
          print(".".join(parts))
          PY
          )
          python3 - "$RUNNER_TEMP/upstream.json" "$upstream_commit" "$version" <<'PY'
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          data = json.loads(source.read_text(encoding="utf-8"))
          data["base_commit"] = sys.argv[2]
          data["version"] = sys.argv[3]
          pathlib.Path(".github/upstream.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          python3 scripts/check_localization_release.py

          git add -- .github/upstream.json
          tree=$(git write-tree)
          commit=$(printf '移植汉化到 OpenVSP %s\n' "$version" | \
            GIT_AUTHOR_NAME='github-actions[bot]' \
            GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            GIT_COMMITTER_NAME='github-actions[bot]' \
            GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
            git commit-tree "$tree" -p "$localized_head" -p "$upstream_commit")

          branch=automation/openvsp-upstream-update
          git fetch origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git push --force-with-lease origin "$commit:refs/heads/$branch"

          {
            echo "changed=true"
            echo "version=$version"
            echo "upstream_commit=$upstream_commit"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Publish review link and update plan issue
        if: steps.transplant.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.transplant.outputs.version }}
          UPSTREAM_COMMIT: ${{ steps.transplant.outputs.upstream_commit }}
          UPDATE_BRANCH: ${{ steps.transplant.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          compare_url="https://github.com/${REPOSITORY}/compare/main...${UPDATE_BRANCH}?expand=1"
          body_file="$RUNNER_TEMP/upstream-ready.md"
          cat > "$body_file" <<EOF
          OpenVSP \`${VERSION}\` 的汉化移植分支已准备好。

          - 官方提交：\`${UPSTREAM_COMMIT}\`
          - 审查分支：\`${UPDATE_BRANCH}\`
          - [打开差异并创建 Pull Request](${compare_url})

          合并前必须完成：

          - [ ] 审查所有冲突附近和新增 GUI 文本
          - [ ] 补译新增界面与离线帮助
          - [ ] Linux/Windows 构建通过
          - [ ] CLI、GUI 和专业页面抽查通过
          - [ ] 更新接力维护说明的版本与验证日期

          审查合并后创建 \`${VERSION}-Codex-AI-zh-CN\` 标签即可触发双平台发布。
          EOF
          issue_number=$(gh issue list --repo "$REPOSITORY" --state open \
            --search '"[自动化] OpenVSP 上游有可用更新" in:title' \
            --json number --jq '.[0].number // empty')
          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" --repo "$REPOSITORY" --body-file "$body_file"
          else
            gh issue create --repo "$REPOSITORY" \
              --title '[自动化] OpenVSP 上游更新分支待审查' --body-file "$body_file"
          fi
          cat "$body_file" >> "$GITHUB_STEP_SUMMARY"
