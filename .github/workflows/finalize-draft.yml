name: Legacy draft maintenance (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify historical guards
        run: python3 -m unittest discover -s scripts -p test_finalize_release_draft.py -v
      - name: Explain immutable replacement flow
        run: echo 'Historical draft/tag writes are retired. Use Build five-platform localized prerelease with an exact source_sha and a NEW -zh-CN.rc.N tag. No old tags or assets were changed.' >> "$GITHUB_STEP_SUMMARY"
