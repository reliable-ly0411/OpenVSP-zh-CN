name: Finalize Verified Release Draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing unpublished release tag
        required: true
      source_commit:
        description: Exact tested source commit
        required: true
      expected_draft_sha:
        description: Expected current unpublished tag commit
        required: true
      build_run_id:
        description: Run containing successful Linux and Windows build jobs
        required: true
      linux_sha256:
        description: SHA-256 of the locally accepted Linux ZIP
        required: true
      windows_sha256:
        description: SHA-256 of the VM-accepted Windows ZIP
        required: true
      validation_note:
        description: Actual desktop acceptance results for the release notes
        required: true
      publish:
        description: Publish after backup and downloaded-asset verification
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: finalize-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      EXPECTED_DRAFT_SHA: ${{ inputs.expected_draft_sha }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      LINUX_SHA256: ${{ inputs.linux_sha256 }}
      WINDOWS_SHA256: ${{ inputs.windows_sha256 }}
      VALIDATION_NOTE: ${{ inputs.validation_note }}
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: maintenance
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          path: source
      - name: Check draft, successful builds, accepted hashes and make backup
        run: python3 maintenance/scripts/finalize_release_draft.py prepare
      - name: Preserve unpublished draft and assets before changes
        uses: actions/upload-artifact@v4
        with:
          name: unpublished-draft-backup
          path: draft-work/backup
          retention-days: 30
      - name: Update only the guarded draft and verify assets before publication
        run: python3 maintenance/scripts/finalize_release_draft.py apply
