name: Build and Release Localized OpenVSP

on:
  workflow_call:
    inputs:
      source_ref:
        description: Exact candidate commit to build without creating a release
        required: true
        type: string
  push:
    tags:
      - "*.*.*-Codex-AI-zh-CN*"
      - "!*-auto.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Localized tag (<version>-Codex-AI-zh-CN or <version>-Codex-AI-zh-CN-rN)
        required: true
        type: string
      publish:
        description: Publish a new GitHub Release after both builds pass
        required: true
        default: false
        type: boolean

      source_commit:
        description: Exact 40-character commit for a new tag; empty builds an existing tag
        required: false
        default: ''
        type: string
      prerelease:
        description: Keep this revision a prerelease and preserve the stable Latest
        required: true
        default: false
        type: boolean
      draft:
        description: Leave the verified release as a draft for desktop acceptance
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  SOURCE_REF: ${{ inputs.source_ref || inputs.source_commit || (github.event_name == 'workflow_dispatch' && inputs.tag) || github.sha }}
  VERIFY_RELEASE_TAG: ${{ !inputs.source_ref && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')) }}
  RELEASE_TAG: ${{ inputs.source_ref || github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.sha }}

concurrency:
  group: localized-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Ubuntu 24.04 x86_64
            os: ubuntu-24.04
            artifact: localized-linux
          - name: Windows 2022 x64
            os: windows-2022
            artifact: localized-windows
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Verify explicitly requested source commit
        if: github.event_name == 'workflow_dispatch' && inputs.source_commit != ''
        shell: bash
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$REQUESTED_COMMIT"

      - name: Verify tag and localization guard on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          if [[ "$VERIFY_RELEASE_TAG" != true ]]; then
            python3 scripts/check_localization_release.py
          else
            python3 scripts/check_localization_release.py --expected-tag "$RELEASE_TAG"
          fi

      - name: Verify tag and localization guard on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:VERIFY_RELEASE_TAG -ne 'true') {
            python -X utf8 scripts/check_localization_release.py
          } else {
            python -X utf8 scripts/check_localization_release.py --expected-tag "$env:RELEASE_TAG"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Localization guard failed' }

      - name: Upstream synchronization regression tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_sync_upstream.py -v

      - name: Release formatting regression tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_release_notes.py -v

      - name: Automatic release regression tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_auto_release.py -v

      - name: Cross-platform package verification regression tests
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_package_checkout.py -v

      - name: Translation regression tests
        shell: bash
        run: |
          cmake -S scripts/localization_tests -B localization-tests
          cmake --build localization-tests --config Release --parallel 2
          ctest --test-dir localization-tests -C Release --output-on-failure

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential gcc-13 g++-13 git curl zip unzip \
            python3-dev python3-numpy libxml2-dev libjpeg-dev libglm-dev \
            fonts-noto-cjk libglew-dev libglu1-mesa-dev libfltk1.3-dev fluid xorg-dev \
            swig doxygen graphviz pandoc

      - name: Build Linux package
        if: runner.os == 'Linux'
        env:
          CC: gcc-13
          CXX: g++-13
        shell: bash
        run: |
          set -euo pipefail
          cmake -S Libraries -B buildlibs -DCMAKE_BUILD_TYPE=Release \
            -DVSP_USE_SYSTEM_LIBXML2=ON -DVSP_USE_SYSTEM_GLM=ON \
            -DVSP_USE_SYSTEM_GLEW=ON
          cmake --build buildlibs --parallel 2
          cmake -S src -B build -DCMAKE_BUILD_TYPE=Release \
            -DVSP_CPACK_GEN=ZIP -DVSP_NO_PYDOC=ON \
            -DVSP_LIBRARY_PATH="$GITHUB_WORKSPACE/buildlibs"
          cmake --build build --target package --parallel 2
          build/vsp/vspscript -script scripts/localization_smoke.as | tee smoke.txt
          grep -q LOCALIZATION_SMOKE_PASS smoke.txt
          if grep -q LOCALIZATION_SMOKE_FAIL smoke.txt; then exit 1; fi
          ldd build/vsp/vsp | tee vsp-ldd.txt
          if grep -q 'not found' vsp-ldd.txt; then
            echo 'Linux 发布包存在未解析的动态库依赖' >&2
            exit 1
          fi
          if grep -q 'libcminpack\.so' vsp-ldd.txt; then
            echo 'Linux 发布包意外依赖系统 libcminpack；必须使用仓库内置静态库' >&2
            exit 1
          fi
          env -u DISPLAY build/vsp/vsp -help > vsp-help.txt
          grep -q '用法' vsp-help.txt
          package=$(find build -maxdepth 1 -type f -name 'OpenVSP-*-Linux.zip' -print -quit)
          test -n "$package"
          unzip -q "$package" -d package-smoke
          packaged_vsp=$(find package-smoke -type f -name vsp -print -quit)
          env -u DISPLAY "$packaged_vsp" -help > packaged-vsp-help.txt
          grep -q '用法' packaged-vsp-help.txt
          mkdir -p artifacts
          cp "$package" "artifacts/OpenVSP-${RELEASE_TAG}-Ubuntu-24.04-x86_64.zip"
          unzip -t "artifacts/OpenVSP-${RELEASE_TAG}-Ubuntu-24.04-x86_64.zip"
          unzip -Z1 "artifacts/OpenVSP-${RELEASE_TAG}-Ubuntu-24.04-x86_64.zip" > package-files.txt
          grep -q '/README_zh-CN.md$' package-files.txt
          grep -q '/AGENTS.md$' package-files.txt
          python3 scripts/check_localized_package.py "artifacts/OpenVSP-${RELEASE_TAG}-Ubuntu-24.04-x86_64.zip"

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install --yes swig pandoc
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
          python -m pip install "numpy<3"
          if ($LASTEXITCODE -ne 0) { throw 'NumPy installation failed' }

      - name: Build Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S Libraries -B buildlibs -A x64 -DCMAKE_BUILD_TYPE=Release
          cmake --build buildlibs --config Release --parallel 2
          cmake -S src -B build -A x64 -DCMAKE_BUILD_TYPE=Release -DVSP_NO_PYDOC=ON `
            "-DVSP_LIBRARY_PATH=$env:GITHUB_WORKSPACE\buildlibs"
          cmake --build build --target package --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows package build failed' }
          & build\vsp\Release\vspscript.exe -script scripts/localization_smoke.as | Tee-Object smoke.txt
          if ($LASTEXITCODE -ne 0 -or -not (Select-String smoke.txt -Pattern LOCALIZATION_SMOKE_PASS -Quiet) -or (Select-String smoke.txt -Pattern LOCALIZATION_SMOKE_FAIL -Quiet)) {
            throw 'Model compatibility smoke test failed'
          }
          & build\vsp\Release\vsp.exe -help | Out-File -Encoding utf8 vsp-help.txt
          if (-not (Select-String -Path vsp-help.txt -Pattern '用法' -Quiet)) {
            throw 'Windows 中文命令行帮助验证失败'
          }
          $package = Get-ChildItem build -Filter 'OpenVSP-*-win64.zip' | Select-Object -First 1
          if (-not $package) { throw '未找到 Windows ZIP 包' }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $package.FullName "artifacts\OpenVSP-$env:RELEASE_TAG-Windows-x64.zip"
          $packageFiles = tar -tf "artifacts\OpenVSP-$env:RELEASE_TAG-Windows-x64.zip"
          if (-not ($packageFiles | Select-String -Pattern '/README_zh-CN\.md$' -Quiet)) {
            throw 'Windows 发布包缺少汉化版更新说明'
          }
          if (-not ($packageFiles | Select-String -Pattern '/AGENTS\.md$' -Quiet)) {
            throw 'Windows 发布包缺少汉化维护规则'
          }

      - name: Verify Windows archive contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -X utf8 scripts/check_localized_package.py "artifacts\OpenVSP-$env:RELEASE_TAG-Windows-x64.zip"
          if ($LASTEXITCODE -ne 0) { throw 'Archive verification failed' }

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ !inputs.source_ref && ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && inputs.publish == true)) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REF }}

      - name: Download verified packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: localized-*
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and consistent release notes
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum -- ./*.zip | tee SHA256SUMS.txt)
          note_flags=()
          if [[ "$PRERELEASE" == true || "$RELEASE_TAG" == *-auto.* ]]; then
            note_flags=(--prerelease)
          fi
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" \
            --source-sha "$(git rev-parse HEAD)" "${note_flags[@]}"

      - name: Create a new immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          KEEP_DRAFT: ${{ inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace notes or assets. Inspect and resume manually.' >&2
            exit 1
          fi
          # A new tag is created only after both packages pass; never move an existing tag.
          source_sha=$(git rev-parse HEAD)
          remote_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [[ -z "$remote_tag" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$source_sha"
          else
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$source_sha"
          fi
          release_flags=(--latest)
          if [[ "$PRERELEASE" == true || "$RELEASE_TAG" == *-auto.* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          title=$(cat release-title.txt)
          gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$title" --notes-file release-notes.md --draft "${release_flags[@]}"
          mkdir downloaded-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir downloaded-release
          (cd downloaded-release && sha256sum -c SHA256SUMS.txt)
          if [[ "$KEEP_DRAFT" != true ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${release_flags[@]}"
          fi
