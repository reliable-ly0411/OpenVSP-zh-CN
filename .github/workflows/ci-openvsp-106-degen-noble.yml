name: "OpenVSP #106 Degen Geometry Ubuntu x64 scoped GUI"

on:
  push:
    branches: [ci/openvsp-106-degen-noble]
    paths:
      - '.github/workflows/ci-openvsp-106-degen-noble.yml'
      - 'scripts/ci/openvsp-106/**'

permissions:
  contents: read
  actions: read

jobs:
  degen-status:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      BASE_SHA: 1e6d02da03b3fd00c175dacced962ea3dc92a5ed
      BASE_TREE: 4693db36b1e1d124632ea1854bebead3779a83f3
      CANDIDATE_SHA: d505f0575515a29b770f5d53d5a4367f88ba96d1
      CANDIDATE_TREE: 0ff2f59b4cbd32b2c8a9eab5ad20b8950d6610a8
      GUI_PATCH_SHA: bf526baf6f8d1a788d1e74a3c6b53e0bafdae85978976ee2497f5bb105fc8c0b
      RC_ARTIFACT_ID: '14702330406'
      RC_ARTIFACT_SHA: bb8ab2168ba31555ad57044c9be10e7c165db0daf7a8d29fc0f3b9e284a56da7
      RC_ZIP_SHA: 3b23e7d116ca0f30f301f6f2400fb88c30d6e98d1d37e34e10d38f3af7a3e560
      RC_VSP_SHA: 0c5464ac8d9c418ac05ad4f06199088b1a644bf9a0e572380d6138d6d0ba8594
      CC: gcc-13
      CXX: g++-13
    steps:
      - name: Checkout exact CI controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Checkout exact product base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BASE_SHA }}
          path: source
          persist-credentials: false
      - name: Verify controller and overlay, record product tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C source rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C source rev-parse HEAD^{tree})" = "$BASE_TREE"
          printf '%s  %s\n' "$GUI_PATCH_SHA" "$GITHUB_WORKSPACE/tooling/scripts/ci/openvsp-106/product.patch" | sha256sum -c -
          git -C source apply --index "$GITHUB_WORKSPACE/tooling/scripts/ci/openvsp-106/product.patch"
          git -C source diff --cached --check
          git -C source diff --cached --name-only > evidence/paths.txt
          diff -u "$GITHUB_WORKSPACE/tooling/scripts/ci/openvsp-106/product-paths.txt" evidence/paths.txt
          tree=$(git -C source write-tree)
          test "$tree" = "$CANDIDATE_TREE"
          export GIT_AUTHOR_NAME='OpenVSP localization CI' GIT_AUTHOR_EMAIL=openvsp-localization@example.invalid
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          export GIT_AUTHOR_DATE=2026-11-22T00:00:00Z GIT_COMMITTER_DATE=2026-11-22T00:00:00Z
          candidate=$(printf '%s\n' 'Localize Degen Geometry export status (#106 candidate)' | git -C source -c commit.gpgsign=false commit-tree "$tree" -p "$BASE_SHA")
          test "$candidate" = "$CANDIDATE_SHA"
          git -C source checkout --detach "$candidate"
          test "$(git -C source rev-parse HEAD)" = "$CANDIDATE_SHA"
          test -z "$(git -C source status --porcelain)"
          {
            printf 'controller=%s\nbase=%s\nbase_tree=%s\npatch_sha256=%s\n' "$GITHUB_SHA" "$BASE_SHA" "$BASE_TREE" "$GUI_PATCH_SHA"
            printf 'candidate=%s\ncandidate_tree=%s\n' "$candidate" "$tree"
            printf 'unchanged_original_actions_run=44889750790\n'
          } > evidence/source.txt
      - name: Use exact original five-example Ubuntu x64 ZIP as the CSV/M reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RC_ARTIFACT_ID" --jq '[.workflow_run.id,.expired,.digest] | @tsv' > evidence/original-artifact.txt
          grep -Fqx $'44889750790\tfalse\tsha256:'"$RC_ARTIFACT_SHA" evidence/original-artifact.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$RC_ARTIFACT_ID/zip" > "$RUNNER_TEMP/original-outer.zip"
          printf '%s  %s\n' "$RC_ARTIFACT_SHA" "$RUNNER_TEMP/original-outer.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/original-outer.zip" OpenVSP-3.56.0-Ubuntu-24.04_amd64-zh-CN.zip > "$RUNNER_TEMP/original.zip"
          printf '%s  %s\n' "$RC_ZIP_SHA" "$RUNNER_TEMP/original.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/original.zip" -d "$RUNNER_TEMP/original"
          printf '%s  %s\n' "$RC_VSP_SHA" "$RUNNER_TEMP/original/OpenVSP-3.56.0-Linux/vsp" | sha256sum -c -
      - name: Install Noble desktop build and GUI test prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-13 g++-13 python3-dev python3-numpy libxml2-dev libjpeg-dev libglm-dev fonts-noto-cjk libglew-dev libglu1-mesa-dev libfltk1.3-dev fluid xorg-dev libgl1-mesa-dri swig xvfb xauth x11-utils xdotool xclip imagemagick
          { lsb_release -a; uname -m; gcc-13 --version; cmake --version; } > evidence/environment.txt 2>&1
          test "$(uname -m)" = x86_64
          grep -q '24.04' evidence/environment.txt
      - name: Build only the newly linked desktop vsp executable
        shell: bash
        run: |
          set -euo pipefail
          cmake -S source/Libraries -B buildlibs -DCMAKE_BUILD_TYPE=Release -DVSP_USE_SYSTEM_LIBXML2=ON -DVSP_USE_SYSTEM_GLM=ON -DVSP_USE_SYSTEM_GLEW=ON 2>&1 | tee evidence/libraries-config.log
          cmake --build buildlibs --parallel 2 2>&1 | tee evidence/libraries-build.log
          cmake -S source/src -B build -DCMAKE_BUILD_TYPE=Release -DVSP_NO_PYDOC=ON -DVSP_NO_DOC=ON -DVSP_NO_API_WRAPPERS=ON -DVSP_LIBRARY_PATH="$GITHUB_WORKSPACE/buildlibs" 2>&1 | tee evidence/configure.log
          cmake --build build --target vsp --parallel 2 2>&1 | tee evidence/build.log
          test -x build/vsp/vsp
          sha256sum build/vsp/vsp > evidence/candidate-binary.sha256
          ldd build/vsp/vsp | tee evidence/candidate.ldd
          ! grep -q 'not found' evidence/candidate.ldd
      - name: Execute original and candidate Degen GUI with real output paths
        shell: bash
        env:
          LANG: C.UTF-8
          LIBGL_ALWAYS_SOFTWARE: '1'
          MESA_SHADER_CACHE_DISABLE: 'true'
        run: |
          set -euo pipefail
          bash tooling/scripts/ci/openvsp-106/degen_gui.sh "$RUNNER_TEMP/original/OpenVSP-3.56.0-Linux" "$GITHUB_WORKSPACE/build/vsp/vsp" "$GITHUB_WORKSPACE/evidence" "$RUNNER_TEMP"
      - name: Upload CI-only logs, exact paths, clipboard bytes, exports and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openvsp-106-degen-noble-proof
          path: evidence/
          if-no-files-found: error
          retention-days: 14
