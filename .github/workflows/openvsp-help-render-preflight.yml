name: OpenVSP 3.56 help production candidate
on:
  push:
    branches: [docs/3.56-help-integration-preflight]
    paths: ['.github/workflows/openvsp-help-render-preflight.yml']
permissions:
  contents: read
jobs:
  help-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin source and install render dependencies
        run: |
          set -euo pipefail
          product=7ca810f7397ca9eb0a735de7f5bde03abe29b6a6
          review=34ec835326c769f22377d69eaec58f1c8cc8dc51
          git fetch --no-tags origin "$product" "$review"
          git worktree add --detach "$RUNNER_TEMP/help-input" "$product"
          cd "$RUNNER_TEMP/help-input"
          test "$(git rev-parse HEAD)" = "$product"
          test "$(git rev-parse HEAD^{tree})" = 554255b476aee34b64f52e6e78fba3f48275b4e8
          test "$(git rev-parse HEAD^)" = 5081da3cb28ebb910e7f5b770cdfd1f85e8c422c
          test "$(git rev-parse HEAD~2)" = ed364d66fe64309ce886b53c5911bba404c265cd
          test "$(git rev-parse HEAD~4)" = e4721e651faebadaefc9c636667410c01a84264a
          test "$(git rev-parse "$review^{tree}")" = 07d001472e71bfe6b3776a5a65df774c123a23bb
          test "$(git diff --name-only "$review" HEAD -- src/help scripts/test_help_anchors.py)" = "$(printf '%s\n' src/help/html/index.html src/help/index.md)"
          test ! -d docs/translation-drafts/3.56
          test -z "$(git status --porcelain)"
          pandoc_version=3.6.4
          curl --fail --silent --show-error --location --retry 3 -o "$RUNNER_TEMP/pandoc.tar.gz" "https://github.com/jgm/pandoc/releases/download/$pandoc_version/pandoc-$pandoc_version-linux-amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/pandoc.tar.gz" -C "$RUNNER_TEMP" "pandoc-$pandoc_version/bin/pandoc"
          export PATH="$RUNNER_TEMP/pandoc-$pandoc_version/bin:$PATH"
          echo "$RUNNER_TEMP/pandoc-$pandoc_version/bin" >> "$GITHUB_PATH"
          test "$(pandoc --version | sed -n '1p')" = "pandoc $pandoc_version"
          pandoc --list-extensions=gfm | grep -E '^[+-]tex_math_gfm$'
          npm install --prefix "$RUNNER_TEMP/help-deps" --no-audit --no-fund marked@16.4.2
          node --version
          pandoc --version
      - name: Check exact candidate bytes and all help anchors
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/help-input"
          export HELP_MODULES="$RUNNER_TEMP/help-deps/node_modules"
          node src/help/build_help_zh.js "$HELP_MODULES" --test
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("src/help")
          pages = ["Airfoils","BOR","Chevron","Clone","Cobra","Conformal","EngineModel","FuselageStack","Gear","Hinge","Human","Mesh","NGonMesh","PtCloud","Routing","SubTab","Wire","XFormTab","XSecSkinning","index"]
          manifest = root / "localized_pages.json"
          original = manifest.read_bytes()
          names = json.loads(original)
          focus = [name + ".md" for name in pages]
          assert len(names) == 30 and set(focus) <= set(names)
          original_html = [name[:-3] + ".html" for name in names if name not in focus]
          assert len(original_html) == 10
          for page in original_html:
              with open(root / "html" / page, "rb") as current:
                  baseline = subprocess.check_output(["git","show","ed364d66:src/help/html/" + page])
                  assert current.read() == baseline, page
          try:
              manifest.write_text(json.dumps(focus, indent=2) + "\n")
              subprocess.run(["node", str(root / "build_help_zh.js"), os.environ["HELP_MODULES"], "--check"], check=True)
          finally:
              manifest.write_bytes(original)
          def html(p):
              return (root / "html" / (p + ".html")).read_text()
          for page in pages:
              text = html(page)
              assert re.search(r'<html\b[^>]*\slang="zh-CN"(?:\s|>)', text), page
              for math in re.findall(r"<math\b[^>]*>.*?</math>", text, re.DOTALL):
                  ET.fromstring(math)
          for p in ("Airfoils","Chevron","EngineModel","FuselageStack","Gear","Human","Mesh","PtCloud","Routing","SubTab","Wire","XFormTab","XSecSkinning"):
              assert "<math " in html(p), p
          for legacy in ("cst","karman-trefftz"):
              assert html("Airfoils").count(f'id="{legacy}"') == 1, legacy
          previously_translated = ["Blank","Ellipsoid","GenTab","MassTab","Pod"]
          review = "34ec835326c769f22377d69eaec58f1c8cc8dc51"
          for file in ["src/help/index.md","src/help/html/index.html"]:
              expected = subprocess.check_output(["git","show",f"{review}:{file}"]).decode()
              for page in previously_translated:
                  pattern = rf'(<a href="{page}\.html">)([^<\n]+)(</a>)' if file.endswith(".html") else rf'(\[)([^\]\n]+)(\]\({page}\.md\))'
                  expected, count = re.subn(pattern, lambda match: match[1] + match[2] + "（中文）" + match[3], expected)
                  assert count == 1, (file, page)
              assert Path(file).read_text() == expected, file
          for page in pages[:-1] + previously_translated:
              assert re.search(rf'<a href="{re.escape(page)}\.html">[^<]+（中文）</a>', html("index")), page
          PY
          python3 scripts/test_help_anchors.py -v
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Verify packaged help copies and produce browser screenshots
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/help-input"
          artifact="$RUNNER_TEMP/help-artifact"
          harness="$RUNNER_TEMP/help-cmake"
          mkdir -p "$artifact/browser" "$harness"
          modules="$(dirname "$(find "$PWD" -iname pandocology.cmake -print -quit)")"
          test -f "$modules/pandocology.cmake" || test -f "$modules/Pandocology.cmake"
          cat > "$harness/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.24)
          project(HelpLayoutCheck NONE)
          include(FindPackageHandleStandardArgs)
          list(APPEND CMAKE_MODULE_PATH "$ENV{HELP_CMAKE_MODULES}")
          set(VSP_BINARY_DIR "${CMAKE_BINARY_DIR}")
          set(SWIG_FOUND TRUE)
          set(PYTHONLIBS_FOUND TRUE)
          add_subdirectory("$ENV{HELP_SOURCE}" help)
          CMAKE
          export HELP_SOURCE="$PWD/src/help" HELP_CMAKE_MODULES="$modules"
          cmake -S "$harness" -B "$harness/build" -DCMAKE_INSTALL_PREFIX="$harness/stage"
          grep '^VSP_USE_PREGENERATED_HELP:BOOL=ON$' "$harness/build/CMakeCache.txt"
          cmake --install "$harness/build"
          python3 -c 'import json; print("\n".join(x[:-3] + ".html" for x in json.load(open("src/help/localized_pages.json"))))' > "$artifact/localized-html.txt"
          test "$(wc -l < "$artifact/localized-html.txt")" -eq 30
          while IFS= read -r page; do
            cmp "src/help/html/$page" "$harness/stage/help/$page"
            cmp "src/help/html/$page" "$harness/stage/python/openvsp/openvsp/help_vsp/$page"
          done < "$artifact/localized-html.txt"
          echo "All 30 Chinese help pages are byte-identical in both CMake install locations."
          if [[ -z "$(fc-list :lang=zh)" ]]; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi
          test -n "$(fc-list :lang=zh)"
          git rev-parse HEAD > "$artifact/product-commit.txt"
          git rev-parse HEAD^{tree} > "$artifact/product-tree.txt"
          for page in Airfoils XFormTab Gear NGonMesh index; do
            cmp "src/help/html/$page.html" "$harness/stage/help/$page.html"
            cmp "src/help/html/$page.html" "$harness/stage/python/openvsp/openvsp/help_vsp/$page.html"
            grep -q "lang=\"zh-CN\"" "$harness/stage/help/$page.html"
            google-chrome --headless --disable-gpu --no-sandbox --window-size=1280,1400 --screenshot="$artifact/browser/$page.png" "file://$harness/stage/help/$page.html"
            test -s "$artifact/browser/$page.png"
          done
          echo "Verified five staged main/Python help pairs byte-identical; captured five Chrome screenshots."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvsp-3.56-help-production-evidence
          path: ${{ runner.temp }}/help-artifact/
          if-no-files-found: error
