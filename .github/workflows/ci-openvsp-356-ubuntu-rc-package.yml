name: OpenVSP 3.56 RC20 Ubuntu x64 candidate package (no publish)
on:
  push:
    branches: [ci/openvsp-356-ubuntu-rc-package]
    paths: ['.github/workflows/ci-openvsp-356-ubuntu-rc-package.yml']
permissions:
  contents: read
concurrency:
  group: openvsp-356-ubuntu-rc-package
  cancel-in-progress: false
jobs:
  ubuntu-x64-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NATIVE_RELEASE: 'true'
      BACKFILL_VERSION: '3.56.0'
      BACKFILL_TAG: '3.56.0-zh-CN.rc.20'
      BACKFILL_SHA: 85426bdb8bd4389d28cf85c480fa0bb269f411ac
      VALIDATED_TOOLING_SHA: d4fb4f15c785cd5441c5b0ca7834c2a8c55aa554
      BACKFILL_PLATFORM: Ubuntu-24.04_amd64
      BACKFILL_ARCH: x86_64
      BACKFILL_LLVM: ''
      BACKFILL_PYTHON: '3.12'
      PYTHONUTF8: '1'
    steps:
      - name: Checkout exact controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: controller
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact reviewed Ubuntu parity tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.VALIDATED_TOOLING_SHA }}
          path: tooling
          fetch-depth: 7
          persist-credentials: false
      - name: Checkout untouched historical 3.56 packaging tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8c1a1b4e4dccf50185f68a33af18d22cf1b748b0
          path: tooling-history
          persist-credentials: false
      - name: Checkout sealed product and complete tag history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.BACKFILL_SHA }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact product, original release guards and localization-only scope
        shell: bash
        run: bash controller/.github/openvsp-qa/verify-rc20-current.sh
      - name: Build and verify only the Ubuntu amd64 native ZIP
        shell: bash
        env:
          OPENVSP_QA_PARITY_PROFILE: ubuntu-24.04-amd64-upstream-3.56.0
        run: bash tooling/scripts/backfill_build.sh
      - name: Record candidate identity and exact ZIP hash
        shell: bash
        run: |
          set -euo pipefail
          cd deliverables
          zip=OpenVSP-3.56.0-Ubuntu-24.04_amd64-zh-CN.zip
          test -s "$zip"
          test "$(find . -maxdepth 1 -name '*.zip' -type f | wc -l)" -eq 1
          for asset in VSPCircXSec.PNG VSPPipeXSec.PNG VSPIXSec.PNG VSPRectXSec.PNG VSPBoxXSec.PNG; do
            mapfile -t paths < <(zipinfo -1 "$zip" | grep -E "^([^/]+/)?textures/$asset$")
            test "${#paths[@]}" -eq 1
            cmp "../source/examples/textures/$asset" <(unzip -p "$zip" "${paths[0]}")
          done
          sha256sum "$zip" > SHA256SUMS.txt
          {
            printf 'controller=%s\nproduct=%s\ntree=%s\nrun=%s\ntooling=%s\n' "$GITHUB_SHA" "$BACKFILL_SHA" "4b7592bad24b17ba60db01c980a3fd99087c0a76" "$GITHUB_RUN_ID" "$VALIDATED_TOOLING_SHA"
            stat -c 'bytes=%s' "$zip"
            cat SHA256SUMS.txt
          } > single-candidate-identity.txt
      - name: Retain the exact candidate ZIP, checksum and native receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openvsp-356-rc20-Ubuntu-24.04_amd64-qa
          path: deliverables/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
