name: Prepare and validate OpenVSP upstream candidates

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Empty selects latest official OpenVSP_x.y.z tag; main/commit creates an isolated dev snapshot
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/prepare-upstream-update.yml'
      - '.github/workflows/release-localized.yml'
      - 'scripts/sync_upstream.py'
      - 'scripts/select_official_release.py'
      - 'scripts/test_sync_upstream.py'
      - 'scripts/upstream_maintenance.py'
      - 'scripts/test_upstream_maintenance.py'
      - 'scripts/test_workflow_policy.py'
      - 'scripts/upstream_ui_report.py'
      - 'scripts/test_upstream_ui_report.py'

permissions:
  contents: read

concurrency:
  group: openvsp-upstream-candidate
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-upstream-update.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || '' }}
  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-localized-pr.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
  report:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
      CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Record candidate outcome without promotion or publication
        run: |
          {
            echo "Candidate: $CANDIDATE_BRANCH ($CANDIDATE_SHA)"
            echo "Lightweight candidate validation result: $BUILD_RESULT"
            echo 'Official release tags are distinguished from dev snapshots. Main, historical tags and public assets are unchanged.'
            echo 'Integrate reviewed fixes with history, then dispatch the five-platform native prerelease workflow with a NEW rc tag.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report candidate retention without deleting refs
        run: python3 -I scripts/upstream_maintenance.py cleanup --output candidate-retention-plan.json
      - name: Save read-only retention plan
        if: always() && hashFiles('candidate-retention-plan.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-retention-plan
          path: candidate-retention-plan.json
          retention-days: 90

  notify:
    needs: [prepare, build]
    if: always() && vars.OPENVSP_NOTIFY_UPSTREAM_FAILURES == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      PREPARE_RESULT: ${{ needs.prepare.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      CANDIDATE_CHANGED: ${{ needs.prepare.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - name: Update one dedicated failure issue, or resolve it after recovery
        run: python3 -I scripts/upstream_maintenance.py notify --apply

  cleanup:
    needs: [prepare, build]
    if: >-
      always() && vars.OPENVSP_CLEAN_MERGED_CANDIDATES == 'true' &&
      needs.prepare.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Remove only merged, inactive candidates after seven days
        run: python3 -I scripts/upstream_maintenance.py cleanup --apply --output candidate-cleanup-record.json
      - name: Keep branch and recovery SHA records even after a partial failure
        if: always() && hashFiles('candidate-cleanup-record.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-cleanup-record
          path: candidate-cleanup-record.json
          retention-days: 90
