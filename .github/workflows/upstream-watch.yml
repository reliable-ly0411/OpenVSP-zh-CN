name: Prepare and validate OpenVSP upstream candidates

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Empty selects latest official OpenVSP_x.y.z tag; main/commit creates an isolated dev snapshot
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/prepare-upstream-update.yml'
      - '.github/workflows/release-localized.yml'
      - 'scripts/sync_upstream.py'
      - 'scripts/select_official_release.py'
      - 'scripts/test_sync_upstream.py'

permissions:
  contents: read

concurrency:
  group: openvsp-upstream-candidate
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-upstream-update.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || '' }}
  build:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/build-localized-pr.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}
  report:
    needs: [prepare, build]
    if: always()
    runs-on: ubuntu-24.04
    env:
      CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
      CANDIDATE_BRANCH: ${{ needs.prepare.outputs.branch }}
      BUILD_RESULT: ${{ needs.build.result }}
    steps:
      - name: Record candidate outcome without promotion or publication
        run: |
          {
            echo "Candidate: $CANDIDATE_BRANCH ($CANDIDATE_SHA)"
            echo "Lightweight candidate validation result: $BUILD_RESULT"
            echo 'Official release tags are distinguished from dev snapshots. Main, historical tags and public assets are unchanged.'
            echo 'Integrate reviewed fixes with history, then dispatch the five-platform native prerelease workflow with a NEW rc tag.'
          } >> "$GITHUB_STEP_SUMMARY"
