name: Sync Build and Publish OpenVSP Upstream

on:
  schedule:
    # UTC 每周一 03:17，即北京时间 11:17；可修改 cron 调整频率。
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Official branch, tag, or commit; empty follows upstream.json
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/upstream-watch.yml'
      - '.github/workflows/prepare-upstream-update.yml'
      - '.github/workflows/release-localized.yml'
      - 'scripts/sync_upstream.py'
      - 'scripts/check_localization_release.py'
      - 'scripts/prepare_auto_release.py'

permissions:
  contents: read

concurrency:
  group: openvsp-upstream-sync
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: write
    uses: ./.github/workflows/prepare-upstream-update.yml
    with:
      upstream_ref: ${{ inputs.upstream_ref || '' }}

  release-status:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      missing: ${{ steps.release.outputs.missing }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Check whether the automatic release is published
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python3 scripts/prepare_auto_release.py --print-tag)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release.json 2> release-error.txt; then
            # 已公开的版本保持不变；草稿需要继续校验后公开。
            echo "missing=$(jq -r .draft release.json)" >> "$GITHUB_OUTPUT"
          elif grep -q 'HTTP 404' release-error.txt; then
            echo 'missing=true' >> "$GITHUB_OUTPUT"
          else
            cat release-error.txt >&2
            exit 1
          fi

  build:
    needs: [prepare, release-status]
    if: needs.prepare.outputs.changed == 'true' || needs.release-status.outputs.missing == 'true'
    # 被调用文件含发布 job，调用权限需兼容；其中构建 job 单独降为只读且禁用发布。
    permissions:
      contents: write
    uses: ./.github/workflows/release-localized.yml
    with:
      source_ref: ${{ needs.prepare.outputs.sha }}

  promote:
    needs: [prepare, build]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout exactly the tested candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Fast-forward main after both builds pass
        env:
          CANDIDATE_SHA: ${{ needs.prepare.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # 普通 push 拒绝覆盖构建期间的并发更新；保留候选分支供下一次检查。
          git push origin "$CANDIDATE_SHA:refs/heads/main"
          echo "已同步通过 Linux/Windows 验证的提交：\`$CANDIDATE_SHA\`。构建包见本次运行 Artifacts。" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [prepare, release-status, build, promote]
    # 无更新但缺少 Release 时 promote 会跳过，仍需完成补发。
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.promote.result == 'success' || needs.prepare.outputs.changed == 'false') && needs.release-status.outputs.missing == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
      RELEASE_TAG: ${{ needs.release-status.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exactly the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Download verified packages from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: localized-*
          path: downloaded-packages
          merge-multiple: true

      - name: Verify packages and prepare versioned release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_localization_release.py --expected-tag "$RELEASE_TAG"
          for platform in Ubuntu-24.04-x86_64 Windows-x64; do
            python3 scripts/check_localized_package.py "downloaded-packages/OpenVSP-${SOURCE_SHA}-${platform}.zip"
          done
          python3 scripts/prepare_auto_release.py --source-sha "$SOURCE_SHA" \
            --packages downloaded-packages --output release-assets

      - name: Publish an immutable prerelease after download verification
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          remote_tag=$(git ls-remote origin "refs/tags/$RELEASE_TAG")
          if [[ -n "$remote_tag" ]]; then
            test "${remote_tag%%[[:space:]]*}" = "$SOURCE_SHA"
          else
            git tag "$RELEASE_TAG" "$SOURCE_SHA"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > existing-release.json 2> release-error.txt; then
            # 重跑只允许校验既有草稿，不覆盖已公开的说明或资产。
            test "$(jq -r .draft existing-release.json)" = true
          elif grep -q 'HTTP 404' release-error.txt; then
            gh release create "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title "OpenVSP ${RELEASE_TAG%%-Codex-AI-zh-CN*} 简体中文自动构建（预发布）" \
              --notes-file release-notes.md --draft --prerelease --latest=false
          else
            cat release-error.txt >&2
            exit 1
          fi
          mkdir verified-release
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir verified-release
          cmp release-assets/SHA256SUMS.txt verified-release/SHA256SUMS.txt
          (cd verified-release && sha256sum -c SHA256SUMS.txt)
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          echo "已公开预发布：https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: [prepare, release-status, build, promote, publish]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - name: Explain failure boundary
        run: echo '自动同步或发布未完成。请检查准备、双平台构建、主分支并发更新和发布步骤；已有标签及公开资产不会被覆盖。' >> "$GITHUB_STEP_SUMMARY"
